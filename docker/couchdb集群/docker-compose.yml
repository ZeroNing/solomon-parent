# CouchDB 三节点集群：三个节点共享 Cookie，由初始化容器自动完成集群建制。
# 管理账号、密码、Cookie 和端口均直接配置在本文件中；生产环境必须修改示例值。
x-couchdb-common: &couchdb-common
  image: couchdb:3.4
  environment:
    COUCHDB_USER: admin
    # 敏感配置：生产环境必须修改此示例值。
    COUCHDB_PASSWORD: "Solomon@2026!"
    # 敏感配置：生产环境必须修改此示例值。
    COUCHDB_SECRET: "solomon-couchdb-cookie-2026"
    ERL_FLAGS: "-setcookie solomon-couchdb-cookie-2026"
  networks:
    - couchdb-cluster
  restart: unless-stopped

services:
  couchdb1:
    <<: *couchdb-common
    container_name: couchdb1
    hostname: couchdb1
    ports: ["5984:5984"]
    volumes: ["./data/1:/opt/couchdb/data"]

  couchdb2:
    <<: *couchdb-common
    container_name: couchdb2
    hostname: couchdb2
    ports: ["5985:5984"]
    volumes: ["./data/2:/opt/couchdb/data"]

  couchdb3:
    <<: *couchdb-common
    container_name: couchdb3
    hostname: couchdb3
    ports: ["5986:5984"]
    volumes: ["./data/3:/opt/couchdb/data"]

  couchdb-cluster-init:
    image: curlimages/curl:8.13.0
    container_name: couchdb-cluster-init
    depends_on: [couchdb1, couchdb2, couchdb3]
    environment:
      COUCHDB_USER: admin
      # 敏感配置：生产环境必须修改此示例值。
      COUCHDB_PASSWORD: "Solomon@2026!"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        auth="$${COUCHDB_USER}:$${COUCHDB_PASSWORD}"
        until curl -fsS -u "$$auth" http://couchdb1:5984/ >/dev/null; do sleep 2; done
        until curl -fsS -u "$$auth" http://couchdb2:5984/ >/dev/null; do sleep 2; done
        until curl -fsS -u "$$auth" http://couchdb3:5984/ >/dev/null; do sleep 2; done
        curl -fsS -u "$$auth" -X POST http://couchdb1:5984/_cluster_setup -H 'Content-Type: application/json' \
          -d '{"action":"enable_cluster","bind_address":"0.0.0.0","username":"admin","password":"Solomon@2026!","node_count":"3","remote_node":"couchdb2","remote_current_user":"admin","remote_current_password":"Solomon@2026!"}'
        curl -fsS -u "$$auth" -X POST http://couchdb1:5984/_cluster_setup -H 'Content-Type: application/json' \
          -d '{"action":"enable_cluster","bind_address":"0.0.0.0","username":"admin","password":"Solomon@2026!","node_count":"3","remote_node":"couchdb3","remote_current_user":"admin","remote_current_password":"Solomon@2026!"}'
        curl -fsS -u "$$auth" -X POST http://couchdb1:5984/_cluster_setup -H 'Content-Type: application/json' \
          -d '{"action":"add_node","host":"couchdb2","port":5984,"username":"admin","password":"Solomon@2026!"}'
        curl -fsS -u "$$auth" -X POST http://couchdb1:5984/_cluster_setup -H 'Content-Type: application/json' \
          -d '{"action":"add_node","host":"couchdb3","port":5984,"username":"admin","password":"Solomon@2026!"}'
        curl -fsS -u "$$auth" -X POST http://couchdb1:5984/_cluster_setup -H 'Content-Type: application/json' \
          -d '{"action":"finish_cluster"}'
    networks:
      - couchdb-cluster
    restart: "no"

networks:
  couchdb-cluster:
    driver: bridge
