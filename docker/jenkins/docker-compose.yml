# Jenkins LTS：持久化任务、插件和构建记录。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Jenkins Web 和 Agent 端口
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    environment:
      LANG: C.UTF-8
      LANGUAGE: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./home:/var/jenkins_home
    restart: unless-stopped
