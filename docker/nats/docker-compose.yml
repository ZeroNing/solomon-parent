# NATS 单机消息服务：启用 JetStream 持久化和 HTTP 监控端口。
# 配置方式：客户端端口 4222、监控端口 8222 均直接写在本文件中。
services:
  nats:
    image: nats:2.11-alpine
    container_name: nats
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./data:/data
    restart: unless-stopped
