# ZooKeeper 三节点集群：节点自动选举 Leader，不固定“主节点”。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# ZooKeeper 三节点客户端端口
x-zookeeper-common: &zookeeper-common
  image: zookeeper:latest
  environment:
    ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
    ZOO_INIT_LIMIT: "10"
    ZOO_SYNC_LIMIT: "5"
    ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,mntr"
  networks:
    - zookeeper-cluster
  restart: unless-stopped

services:
  zookeeper1:
    <<: *zookeeper-common
    container_name: zookeeper1
    environment:
      ZOO_MY_ID: "1"
      ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
      ZOO_INIT_LIMIT: "10"
      ZOO_SYNC_LIMIT: "5"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,mntr"
    ports:
      - "2181:2181"
    volumes:
      - ./data/1/data:/data
      - ./data/1/datalog:/datalog
      - ./logs/1:/logs

  zookeeper2:
    <<: *zookeeper-common
    container_name: zookeeper2
    environment:
      ZOO_MY_ID: "2"
      ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
      ZOO_INIT_LIMIT: "10"
      ZOO_SYNC_LIMIT: "5"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,mntr"
    ports:
      - "2182:2181"
    volumes:
      - ./data/2/data:/data
      - ./data/2/datalog:/datalog
      - ./logs/2:/logs

  zookeeper3:
    <<: *zookeeper-common
    container_name: zookeeper3
    environment:
      ZOO_MY_ID: "3"
      ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
      ZOO_INIT_LIMIT: "10"
      ZOO_SYNC_LIMIT: "5"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,mntr"
    ports:
      - "2183:2181"
    volumes:
      - ./data/3/data:/data
      - ./data/3/datalog:/datalog
      - ./logs/3:/logs

networks:
  zookeeper-cluster:
    driver: bridge
