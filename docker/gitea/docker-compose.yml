# Gitea 单机部署：使用外部 MySQL，数据库连接信息直接配置在本文件中。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Gitea 外部数据库和访问端口
services:
  gitea:
    image: gitea/gitea:1.25-nightly
    container_name: gitea
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: mysql
      GITEA__database__HOST: "host.docker.internal:3306"
      GITEA__database__NAME: "gitea"
      GITEA__database__USER: "gitea"
      # 敏感配置：生产环境必须修改此示例值。
      GITEA__database__PASSWD: "Solomon@2026!"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    restart: unless-stopped
