# Neo4j 社区版图数据库：提供 Web 控制台和 Bolt 协议。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Neo4j 管理密码、内存和端口
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    environment:
      # 敏感配置：生产环境必须修改此示例值。
      NEO4J_AUTH: "neo4j/Solomon@2026!"
      NEO4J_server_memory_pagecache_size: "512M"
      NEO4J_server_memory_heap_initial__size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./plugins:/plugins
    restart: unless-stopped
