# RabbitMQ 延迟队列：容器首次启动时通过脚本下载插件，需要访问 GitHub。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# 脚本下载版 RabbitMQ 延迟队列账号和端口
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-delayed-download
    hostname: rabbitmq-delayed-download
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      # 敏感配置：生产环境必须修改此示例值。
      RABBITMQ_DEFAULT_PASS: "Solomon@2026!"
    ports:
      - "5676:5672"
      - "15676:15672"
    volumes:
      - ./start-rabbitmq-with-plugin.sh:/usr/local/bin/start-rabbitmq-with-plugin.sh:ro
      - ./data:/var/lib/rabbitmq
      - ./plugins:/plugins
      - /etc/localtime:/etc/localtime:ro
    command: ["/bin/bash", "/usr/local/bin/start-rabbitmq-with-plugin.sh"]
    restart: unless-stopped
