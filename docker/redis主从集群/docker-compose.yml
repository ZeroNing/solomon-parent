# Redis 主从部署：一个主节点、两个只读副本，不包含 Sentinel。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Redis 主从密码和端口
x-redis-common: &redis-common
  image: redis:latest
  restart: unless-stopped
  networks:
    - redis-replication

services:
  redis-master:
    <<: *redis-common
    container_name: redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./data/1:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "Solomon@2026!"

  redis-replica1:
    <<: *redis-common
    container_name: redis-replica1
    depends_on:
      - redis-master
    ports:
      - "6380:6379"
    volumes:
      - ./data/2:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --replicaof
      - redis-master
      - "6379"
      - --masterauth
      - "Solomon@2026!"
      - --requirepass
      - "Solomon@2026!"

  redis-replica2:
    <<: *redis-common
    container_name: redis-replica2
    depends_on:
      - redis-master
    ports:
      - "6381:6379"
    volumes:
      - ./data/3:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --replicaof
      - redis-master
      - "6379"
      - --masterauth
      - "Solomon@2026!"
      - --requirepass
      - "Solomon@2026!"

networks:
  redis-replication:
    driver: bridge
