# Redis 高可用部署：一个主节点、两个副本、三个 Sentinel。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Redis 主从加哨兵密码和端口
x-redis-common: &redis-common
  image: redis:latest
  restart: unless-stopped
  networks:
    - redis-ha

x-sentinel-common: &sentinel-common
  image: redis:latest
  restart: unless-stopped
  environment:
    # 敏感配置：生产环境必须修改此示例值。
    REDIS_PASSWORD: "Solomon@2026!"
  networks:
    - redis-ha
  depends_on:
    - redis-master
    - redis-replica1
    - redis-replica2
  entrypoint:
    - /bin/sh
    - -c
  command:
    - |
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      dir /tmp
      sentinel monitor mymaster redis-master 6379 2
      sentinel auth-pass mymaster $${REDIS_PASSWORD}
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000
      EOF
      exec redis-sentinel /tmp/sentinel.conf

services:
  redis-master:
    <<: *redis-common
    container_name: redis-ha-master
    ports:
      - "6379:6379"
    volumes:
      - ./data/1:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "Solomon@2026!"

  redis-replica1:
    <<: *redis-common
    container_name: redis-ha-replica1
    depends_on:
      - redis-master
    ports:
      - "6380:6379"
    volumes:
      - ./data/2:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --replicaof
      - redis-master
      - "6379"
      - --masterauth
      - "Solomon@2026!"
      - --requirepass
      - "Solomon@2026!"

  redis-replica2:
    <<: *redis-common
    container_name: redis-ha-replica2
    depends_on:
      - redis-master
    ports:
      - "6381:6379"
    volumes:
      - ./data/3:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --replicaof
      - redis-master
      - "6379"
      - --masterauth
      - "Solomon@2026!"
      - --requirepass
      - "Solomon@2026!"

  redis-sentinel1:
    <<: *sentinel-common
    container_name: redis-ha-sentinel1
    ports:
      - "26379:26379"

  redis-sentinel2:
    <<: *sentinel-common
    container_name: redis-ha-sentinel2
    ports:
      - "26380:26379"

  redis-sentinel3:
    <<: *sentinel-common
    container_name: redis-ha-sentinel3
    ports:
      - "26381:26379"

networks:
  redis-ha:
    driver: bridge
