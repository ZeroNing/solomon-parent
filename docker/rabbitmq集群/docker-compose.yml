# RabbitMQ 两节点集群：节点使用相同 Erlang Cookie，第二节点自动加入第一节点。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# RabbitMQ 两节点集群账号、Cookie 和端口
x-rabbitmq-common: &rabbitmq-common
  image: rabbitmq:management
  environment:
    # 敏感配置：生产环境必须修改此示例值。
    RABBITMQ_ERLANG_COOKIE: "solomon-cluster-cookie-2026-change-in-production"
    RABBITMQ_DEFAULT_USER: "admin"
    # 敏感配置：生产环境必须修改此示例值。
    RABBITMQ_DEFAULT_PASS: "Solomon@2026!"
  volumes:
    - ./init-rabbitmq-cluster.sh:/usr/local/bin/init-rabbitmq-cluster.sh:ro
  networks:
    - rabbitmq-cluster
  restart: unless-stopped

services:
  rabbitmq1:
    <<: *rabbitmq-common
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      # 敏感配置：生产环境必须修改此示例值。
      RABBITMQ_ERLANG_COOKIE: "solomon-cluster-cookie-2026-change-in-production"
      RABBITMQ_DEFAULT_USER: "admin"
      # 敏感配置：生产环境必须修改此示例值。
      RABBITMQ_DEFAULT_PASS: "Solomon@2026!"
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      CLUSTER_PRIMARY: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./init-rabbitmq-cluster.sh:/usr/local/bin/init-rabbitmq-cluster.sh:ro
      - ./data/1:/var/lib/rabbitmq
      - ./logs/1:/var/log/rabbitmq
    command: ["/bin/bash", "/usr/local/bin/init-rabbitmq-cluster.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq2:
    <<: *rabbitmq-common
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      # 敏感配置：生产环境必须修改此示例值。
      RABBITMQ_ERLANG_COOKIE: "solomon-cluster-cookie-2026-change-in-production"
      RABBITMQ_DEFAULT_USER: "admin"
      # 敏感配置：生产环境必须修改此示例值。
      RABBITMQ_DEFAULT_PASS: "Solomon@2026!"
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      CLUSTER_PRIMARY: rabbitmq1
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./init-rabbitmq-cluster.sh:/usr/local/bin/init-rabbitmq-cluster.sh:ro
      - ./data/2:/var/lib/rabbitmq
      - ./logs/2:/var/log/rabbitmq
    command: ["/bin/bash", "/usr/local/bin/init-rabbitmq-cluster.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  rabbitmq-cluster:
    driver: bridge
