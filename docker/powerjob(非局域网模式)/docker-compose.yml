# PowerJob 公网部署：通过 JVM 参数显式声明客户端可访问的公网地址。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# PowerJob 公网部署参数
services:
  powerjob-server:
    image: powerjob/powerjob-server:latest
    container_name: powerjob-server-public
    environment:
      TZ: Asia/Shanghai
      JVMOPTIONS: >-
        -Xms256m -Xmx512m
        -Dpowerjob.network.external.address=host.docker.internal
        -Dpowerjob.network.external.port.http=10010
        -Dpowerjob.network.external.port.akka=10086
      PARAMS: >-
        --spring.profiles.active=product
        --spring.datasource.core.jdbc-url=jdbc:mysql://host.docker.internal:3306/powerjob?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.core.username=powerjob
        --spring.datasource.core.password=Solomon@2026!
        --oms.auth.initiliaze.admin.password=Solomon@2026!
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7700:7700"
      - "10086:10086"
      - "10010:10010"
    volumes:
      - ./logs:/var/log
    restart: unless-stopped
