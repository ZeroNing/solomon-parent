# EMQX 两节点静态集群：两个节点使用相同 Cookie 并通过固定节点名发现彼此。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# EMQX 两节点集群配置
x-emqx-common: &emqx-common
  image: emqx/emqx:latest
  environment:
    # 敏感配置：生产环境必须修改此示例值。
    EMQX_NODE__COOKIE: "solomon-cluster-cookie-2026-change-in-production"
    EMQX_CLUSTER__DISCOVERY_STRATEGY: static
    EMQX_CLUSTER__STATIC__SEEDS: "emqx@node1.emqx.com,emqx@node2.emqx.com"
  networks:
    - emqx-cluster
  restart: unless-stopped

services:
  emqx1:
    <<: *emqx-common
    container_name: emqx1
    environment:
      # 敏感配置：生产环境必须修改此示例值。
      EMQX_NODE__COOKIE: "solomon-cluster-cookie-2026-change-in-production"
      EMQX_NODE__NAME: emqx@node1.emqx.com
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static
      EMQX_CLUSTER__STATIC__SEEDS: "emqx@node1.emqx.com,emqx@node2.emqx.com"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - ./data/1:/opt/emqx/data
      - ./logs/1:/opt/emqx/log
    networks:
      emqx-cluster:
        aliases:
          - node1.emqx.com

  emqx2:
    <<: *emqx-common
    container_name: emqx2
    environment:
      # 敏感配置：生产环境必须修改此示例值。
      EMQX_NODE__COOKIE: "solomon-cluster-cookie-2026-change-in-production"
      EMQX_NODE__NAME: emqx@node2.emqx.com
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static
      EMQX_CLUSTER__STATIC__SEEDS: "emqx@node1.emqx.com,emqx@node2.emqx.com"
    ports:
      - "21883:1883"
      - "28083:8083"
      - "28084:18083"
    volumes:
      - ./data/2:/opt/emqx/data
      - ./logs/2:/opt/emqx/log
    networks:
      emqx-cluster:
        aliases:
          - node2.emqx.com

networks:
  emqx-cluster:
    driver: bridge
