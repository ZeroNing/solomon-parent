# XXL-JOB 管理端：依赖已初始化表结构的外部 MySQL。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# XXL-JOB 外部数据库和访问参数
services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xxl-job-admin
    environment:
      TZ: Asia/Shanghai
      JVMOPTIONS: "-Xms256m -Xmx512m"
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://host.docker.internal:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=xxl_job
        --spring.datasource.password=Solomon@2026!
        --xxl.job.accessToken=Solomon@2026!
        --xxl.job.log.path=/data/applogs/xxl-job
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/data/applogs/xxl-job
    restart: unless-stopped
