# Kibana：连接外部 Elasticsearch，版本应与 Elasticsearch 保持一致。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Kibana 外部 Elasticsearch 地址
services:
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.2
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://host.docker.internal:9200"
      I18N_LOCALE: zh-CN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5601:5601"
    restart: unless-stopped
