# Dragonfly 单机缓存：兼容 Redis 协议，定时生成快照到数据目录。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Dragonfly 密码和端口
services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: dragonfly
    ulimits:
      memlock: -1
    command:
      - --dir=/data
      - --dbfilename=dump
      - "--snapshot_cron=*/5 * * * *"
      - --requirepass=Solomon@2026!
    ports:
      - "6389:6379"
    volumes:
      - ./data:/data
    restart: unless-stopped
