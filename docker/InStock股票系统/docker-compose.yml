# InStock 股票系统：外部数据库连接信息直接配置在本文件中。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# InStock 外部数据库连接
services:
  instock:
    image: mayanghua/instock:latest  # 使用的镜像
    container_name: InStock         # 容器名称
    ports:
      - "9988:9988"                 # 端口映射：宿主机:容器
    environment:
      db_host: "host.docker.internal"
      db_user: "root"
      db_password: "Solomon@2026!"
      db_database: "instockdb"
      db_port: "3306"
    stdin_open: true                # 等价于 `-i`，保持标准输入打开
    tty: true                       # 等价于 `-t`，分配终端
    restart: unless-stopped
