# MySQL 单机部署：账号、密码和端口均直接配置在本文件中。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# MySQL 初始化账号和端口
services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      # 敏感配置：生产环境必须修改此示例值。
      MYSQL_ROOT_PASSWORD: "Solomon@2026!"
      MYSQL_DATABASE: "admin"
      MYSQL_USER: "admin"
      # 敏感配置：生产环境必须修改此示例值。
      MYSQL_PASSWORD: "Solomon@2026!"
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro # 容器与宿主机时间同步
    restart: unless-stopped
