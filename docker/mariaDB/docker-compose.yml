# MariaDB 单机部署：初始化账号和密码直接配置在本文件中。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# MariaDB 初始化账号和端口
services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      # 敏感配置：生产环境必须修改此示例值。
      MARIADB_ROOT_PASSWORD: "Solomon@2026!"
      MARIADB_DATABASE: "admin"
      MARIADB_USER: "admin"
      # 敏感配置：生产环境必须修改此示例值。
      MARIADB_PASSWORD: "Solomon@2026!"
    ports:
      - "3307:3306"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/var/lib/mysql
      - ./logs:/var/log/mysql
    restart: unless-stopped
