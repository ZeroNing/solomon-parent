# 禅道单机应用：使用外部 MySQL，连接信息直接配置在本文件中。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# 禅道外部 MySQL 和访问端口
services:
  zentao:
    image: easysoft/zentao:latest
    container_name: zentao
    environment:
      ZT_MYSQL_HOST: "host.docker.internal"
      ZT_MYSQL_PORT: "3306"
      ZT_MYSQL_USER: "zentao"
      # 敏感配置：生产环境必须修改此示例值。
      ZT_MYSQL_PASSWORD: "Solomon@2026!"
      ZT_MYSQL_DB: "zentao"
      MYSQL_INTERNAL: "false"
      LOG_PATH: /var/www/html/log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:80"
    volumes:
      - ./pms:/www/zentaopms
    restart: unless-stopped
