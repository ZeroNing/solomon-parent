# Redis 纯哨兵部署：监控外部 Redis 主节点，不创建 Redis 数据节点。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Redis 纯哨兵监控目标和端口
# Linux 上默认通过 host.docker.internal 访问宿主机，需要其他目标时直接修改下方地址。
x-sentinel-common: &sentinel-common
  image: redis:latest
  restart: unless-stopped
  environment:
    # 敏感配置：生产环境必须修改此示例值。
    REDIS_PASSWORD: "Solomon@2026!"
    MASTER_HOST: "host.docker.internal"
    MASTER_PORT: "6379"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - redis-sentinel
  entrypoint:
    - /bin/sh
    - -c
  command:
    - |
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      dir /tmp
      sentinel monitor mymaster $${MASTER_HOST} $${MASTER_PORT} 2
      sentinel auth-pass mymaster $${REDIS_PASSWORD}
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000
      EOF
      exec redis-sentinel /tmp/sentinel.conf

services:
  redis-sentinel1:
    <<: *sentinel-common
    container_name: redis-sentinel1
    ports:
      - "26379:26379"

  redis-sentinel2:
    <<: *sentinel-common
    container_name: redis-sentinel2
    ports:
      - "26380:26379"

  redis-sentinel3:
    <<: *sentinel-common
    container_name: redis-sentinel3
    ports:
      - "26381:26379"

networks:
  redis-sentinel:
    driver: bridge
