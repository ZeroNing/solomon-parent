# Nacos 三节点集群：依赖外部 MySQL，所有节点共享鉴权和数据源配置。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Nacos 集群鉴权、外部 MySQL 和节点端口
x-nacos-environment: &nacos-environment
  MODE: cluster
  # 敏感配置：生产环境必须修改此示例值。
  NACOS_AUTH_ENABLE: "true"
  # 敏感配置：生产环境必须修改此示例值。
  NACOS_AUTH_TOKEN: "c29sb21vbi1uYWNvcy1hdXRoLXRva2VuLWNoYW5nZS1tZS0yMDI2"
  # 敏感配置：生产环境必须修改此示例值。
  NACOS_AUTH_IDENTITY_KEY: "Solomon@2026!"
  # 敏感配置：生产环境必须修改此示例值。
  NACOS_AUTH_IDENTITY_VALUE: "Solomon@2026!"
  NACOS_SERVERS: "nacos1:8848 nacos2:8848 nacos3:8848"
  SPRING_DATASOURCE_PLATFORM: mysql
  MYSQL_SERVICE_HOST: "host.docker.internal"
  MYSQL_SERVICE_PORT: "3306"
  MYSQL_SERVICE_DB_NAME: "nacos"
  MYSQL_SERVICE_USER: "nacos"
  # 敏感配置：生产环境必须修改此示例值。
  MYSQL_SERVICE_PASSWORD: "Solomon@2026!"
  MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&serverTimezone=Asia/Shanghai"
  JVM_XMS: "512m"
  JVM_XMX: "512m"
  JVM_XMN: "256m"

x-nacos-common: &nacos-common
  image: nacos/nacos-server:latest
  environment:
    <<: *nacos-environment
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - nacos-cluster
  restart: unless-stopped

services:
  nacos1:
    <<: *nacos-common
    container_name: nacos1
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./data/1:/home/nacos/data
      - ./logs/1:/home/nacos/logs
      - /etc/localtime:/etc/localtime:ro

  nacos2:
    <<: *nacos-common
    container_name: nacos2
    ports:
      - "8858:8848"
      - "9858:9848"
      - "9859:9849"
    volumes:
      - ./data/2:/home/nacos/data
      - ./logs/2:/home/nacos/logs
      - /etc/localtime:/etc/localtime:ro

  nacos3:
    <<: *nacos-common
    container_name: nacos3
    ports:
      - "8868:8848"
      - "9868:9848"
      - "9869:9849"
    volumes:
      - ./data/3:/home/nacos/data
      - ./logs/3:/home/nacos/logs
      - /etc/localtime:/etc/localtime:ro

networks:
  nacos-cluster:
    driver: bridge
