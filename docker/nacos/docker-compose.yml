# Nacos 单机部署：鉴权信息直接配置在本文件中，禁止使用公开默认密钥。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# Nacos 单机鉴权参数
# NACOS_AUTH_TOKEN 必须是 Base64 编码且解码后不少于 32 字节。
services:
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone #单机模式
      - NACOS_AUTH_ENABLE=true #是否开启鉴权
      - NACOS_AUTH_TOKEN=c29sb21vbi1uYWNvcy1hdXRoLXRva2VuLWNoYW5nZS1tZS0yMDI2
      - NACOS_AUTH_IDENTITY_KEY=Solomon@2026!
      - NACOS_AUTH_IDENTITY_VALUE=Solomon@2026!
      - JAVA_OPT=-Xms2g -Xmx2g -Xmn1g -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m
    volumes:
      - ./data:/home/nacos/data
      - ./logs:/home/nacos/logs
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
