# RocketMQ 单 Broker 部署：包含 NameServer、Broker 和 Dashboard。
# 配置方式：环境变量、端口和外部地址均在本文件中直接配置，无需 .env 文件。
# 生产部署前请修改示例密码、令牌、对外地址，并按需调整宿主机端口。
# RocketMQ 对外地址和端口
services:
  nameserver:
    image: apache/rocketmq:latest
    container_name: rocketmq-nameserver
    environment:
      MAX_HEAP_SIZE: 256M
      HEAP_NEWSIZE: 128M
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    volumes:
      - ./logs/nameserver:/home/rocketmq/logs
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  broker:
    image: apache/rocketmq:latest
    container_name: rocketmq-broker
    depends_on:
      - nameserver
    environment:
      NAMESRV_ADDR: nameserver:9876
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 256M
      ROCKETMQ_BROKER_HOST: "host.docker.internal"
    command:
      - /bin/sh
      - -c
      - |
        cp /home/rocketmq/broker-base.conf /tmp/broker.conf
        echo "brokerIP1=$${ROCKETMQ_BROKER_HOST}" >> /tmp/broker.conf
        exec sh mqbroker -c /tmp/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./logs/broker:/home/rocketmq/logs
      - ./data:/home/rocketmq/store
      - ./conf/broker.conf:/home/rocketmq/broker-base.conf:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    depends_on:
      - nameserver
    environment:
      JAVA_OPTS: >-
        -Xms256M -Xmx256M -Xmn128M
        -Drocketmq.namesrv.addr=nameserver:9876
        -Dcom.rocketmq.sendMessageWithVIPChannel=false
    ports:
      - "8080:8080"
    restart: unless-stopped
