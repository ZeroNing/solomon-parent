# GS1 EPC encoding messages (zh)
B0004=条码长度无效，输入值：{0}，需要{1}位
B4001=EPC十六进制编码无效，输入值：{0}
B4002=EPC头部不匹配，无法识别的EPC类型：{0}
B4003=EPC公司前缀长度无效，范围6~12，输入值：{0}
B4004=EPC分区值无效，输入值：{0}
B4005=EPC序列号无效，输入值：{0}
B4006=EPC序列号超出范围，范围0~274877906943，输入值：{0}
B4007=EPC Tag Size无效，SGTIN支持96/198，GIAI支持96/202，输入值：{0}
B4008=不支持的GS1 AI，输入值：{0}
B4009=缺少GS1 AI，支持AI 01+21和AI 8004，输入值：{0}
B4010=GIAI资产参考无效，输入值：{0}